name: Terraform Pipeline which formats, validates and upon approval provisions your infrastructure

on:
  push:
    branches: [eks-setup]
  pull_request:
    branches: [eks-setup]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1
  TF_LOG: info
  TF_WORKSPACE: prod

permissions:
  issues: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      contains(github.event.head_commit.message, 'pipeline-run')
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: terraform-linters/setup-tflint@v4
      - run: |
          tflint --init
          tflint

      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
      - name: AWS configure the credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Create prod.tfvars file
        shell: bash
        run: |
           printf "%s" "${{ secrets.PROD_TF_VARS_SECRET }}" > prod.tfvars

      - run: terraform init -input=false

      - run: |
          terraform workspace select prod || terraform workspace new prod

      - run: terraform fmt -check
      - run: terraform validate

      - run: terraform plan -var-file="prod.tfvars" -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan

  terraform-apply:
    name: Terraform Apply (Manual Approval)
    needs: terraform-plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: prod 

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false
      - run: terraform workspace select prod

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan
