name: Terraform Pipeline which formats, validates and upon approval provisions your infrastructure

on:
  push:
    branches: [eks-setup]
  pull_request:
    branches: [eks-setup]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ap-south-1
  TF_LOG: TRACE

permissions:
  issues: write
  contents: read
  pull-requests: write
jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      contains(github.event.head_commit.message, 'pipeline-run')
    steps:
        - name: Checkout the code      
          uses: actions/checkout@v4

        - name: Setup the terraform environment
          uses: hashicorp/setup-terraform@v3

        - name: Setup the TFLint
          uses: terraform-linters/setup-tflint@v4
        - run: |
            tflint --init
            tflint
        - name: Scan the Terraform scripts using Trivy
          uses: aquasecurity/trivy-action@0.24.0
          with:
            scan-type: config
            severity: HIGH,CRITICAL
        - name: AWS configure the credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
                aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_DEFAULT_REGION }}

        - name: Create prod.tfvars file
          shell: bash
          run: |
            set +x
            echo "${{ secrets.PROD_TF_VARS_SECRET }}" | base64 -d > prod.tfvars
            set -x

        - run: terraform init -input=false

        - run: |
                if [ "${{ github.event_name }}" = "pull_request" ]; then
                BRANCH_NAME="${{ github.head_ref }}"
                else
                BRANCH_NAME="${{ github.ref_name }}"
                fi

                echo "Branch detected: $BRANCH_NAME"

                if [ "$BRANCH_NAME" = "eks-setup" ]; then
                WORKSPACE="prod"
                else
                WORKSPACE="default"
                fi

                terraform workspace select "$WORKSPACE" || terraform workspace new "$WORKSPACE"

        - name: Check files for fomatting & format the files
          run: terraform fmt -recursive

        - name: Validate the files for syntax
          run: terraform validate

        - name: Terraform plan
          run: terraform plan -var-file="prod.tfvars" -out=tfplan -lock-timeout=10m

        - name: Upload the artifact to Github workspace
          uses: actions/upload-artifact@v4
          with:
            name: tfplan
            path: tfplan

  terraform-apply:
    name: Terraform Apply (Manual Approval)
    needs: terraform-plan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: prod 

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -input=false
      - run: terraform workspace select prod

      - uses: actions/download-artifact@v4
        with:
          name: tfplan

      - run: terraform apply -auto-approve tfplan
